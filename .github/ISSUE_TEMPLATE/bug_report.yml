name: Bug report
description: Something isn't working right
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you run, and what did you expect instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: awake --version output
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste the output of `awake status` and, if this is about sleep not restoring, `pmset -g | grep SleepDisabled`.
      render: shell
