<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-labelledby="t d">
  <title id="t">Closing the lid: caffeinate vs awake</title>
  <desc id="d">Two timelines. Plain caffeinate keeps a Mac awake until the lid closes, then it sleeps. awake continues running straight through the lid-close point to the end of the session.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- card background: deep navy reads on both light and dark README backgrounds -->
  <rect x="0" y="0" width="800" height="320" rx="16" fill="#040955"/>
  <rect x="1" y="1" width="798" height="318" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- title -->
  <text x="400" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Closing the lid</text>

  <!-- lid-close marker: label + downward pointer + shared dashed line at x=500 -->
  <text x="500" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">lid closes</text>
  <path d="M492 99 H508 L500 111 Z" fill="#d21476"/>
  <line x1="500" y1="111" x2="500" y2="240" stroke="#d21476" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- Row 1: caffeinate -->
  <text x="182" y="161" text-anchor="end" font-size="16" font-weight="600" fill="#ffffff">caffeinate</text>
  <!-- awake before the lid closes -->
  <rect x="200" y="142" width="288" height="28" rx="14" fill="#f0ff1e"/>
  <!-- asleep after the lid closes: hollow, dashed, faded -->
  <rect x="512" y="142" width="248" height="28" rx="14" fill="#d21476" fill-opacity="0.12" stroke="#d21476" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="636" y="161" text-anchor="middle" font-size="13" fill="#ffffff" fill-opacity="0.9">asleep</text>

  <!-- Row 2: awake -->
  <text x="182" y="231" text-anchor="end" font-size="16" font-weight="700" fill="#f0ff1e">awake</text>
  <!-- one unbroken bar straight through the lid-close point -->
  <rect x="200" y="212" width="560" height="28" rx="14" fill="#f0ff1e"/>
  <text x="636" y="231" text-anchor="middle" font-size="13" font-weight="600" fill="#040955">stays awake</text>

  <!-- takeaway -->
  <text x="400" y="296" text-anchor="middle" font-size="12.5" fill="#ffffff" fill-opacity="0.62">only awake blocks clamshell (lid-close) sleep</text>
</svg>
